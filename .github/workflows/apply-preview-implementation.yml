name: Apply Reviewed Preview Implementation

on:
  push:
    branches: [feature/issue-32-18-image-views]
    paths: ['.ci/preview-patch/**', '.github/workflows/apply-preview-implementation.yml']

permissions:
  contents: read

concurrency:
  group: apply-preview-implementation
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/feature/issue-32-18-image-views'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Verify reviewed transport and stage source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/preview-results"
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, os
          root = pathlib.Path('.ci/preview-patch')
          parts = [p.read_text().strip() for p in sorted(root.glob('*.b64'))]
          assert len(parts) == 4
          # Repair text-transport transcription; the decoded source is accepted
          # only if it matches the independently computed reviewed SHA-256.
          parts[1] = parts[1].replace('tbXTjj94', 'tbXTj94').replace('NWfMqsTht', 'NWfMqsNht').replace('OO7eH6Fqgzp', 'OO7eH6jgzp').replace('BfZZfXVhtt', 'BfZfXVhtt')
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '4547ffe8cb5c898922784512a28cedc38b0bf731e50efdb5ebbfd9ca78a5e690', digest
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'preview-feature.patch'
          path.write_bytes(patch)
          print('Reviewed patch SHA-256:', digest)
          PY
          git apply --check "$RUNNER_TEMP/preview-feature.patch"
          git apply --index "$RUNNER_TEMP/preview-feature.patch"
          git diff --cached --check
          git diff --cached --stat
      - name: Commit implementation to feature branch (never main)
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feature/issue-32-18-image-views
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add article preview images and persistent list magazine card views'
          git push origin HEAD:refs/heads/feature/issue-32-18-image-views
          git rev-parse HEAD | tee "$RUNNER_TEMP/preview-results/verified-commit.txt"
      - uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-markdown
          ref: '0.8.0'
          path: .ci-deps/swift-markdown
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-cmark
          ref: '0.8.0'
          path: .ci-deps/swift-cmark
          persist-credentials: false
      - name: Pinned dependency transport
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          test "$(git -C .ci-deps/swift-markdown rev-parse HEAD)" = 3c6f9523da3a1ec2fd829673e472d95b8097a3b8
          test "$(git -C .ci-deps/swift-cmark rev-parse HEAD)" = 924936d0427cb25a61169739a7660230bffa6ea6
          git config --global http.version HTTP/1.1
          git config --global url."file://$GITHUB_WORKSPACE/.ci-deps/swift-markdown/.git".insteadOf https://github.com/swiftlang/swift-markdown.git
          git config --global url."file://$GITHUB_WORKSPACE/.ci-deps/swift-cmark/.git".insteadOf https://github.com/swiftlang/swift-cmark.git
          swift package resolve
      - name: Core regression
        run: ./scripts/verify.sh --core 2>&1 | tee "$RUNNER_TEMP/preview-results/core.log"
      - name: Feature regression
        if: ${{ !cancelled() }}
        run: ./scripts/verify.sh --feature 2>&1 | tee "$RUNNER_TEMP/preview-results/feature.log"
      - name: Reader and shortcut regression
        if: ${{ !cancelled() }}
        run: ./scripts/verify.sh --web 2>&1 | tee "$RUNNER_TEMP/preview-results/web.log"
      - name: Unsigned macOS host build
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -project PaperRss.xcodeproj -scheme PaperRss -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/PaperRss-build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/preview-results/xcode.log"
      - name: Archive source and verification logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/preview-results"
          git archive --format=tar.gz --output="$RUNNER_TEMP/preview-results/source.tar.gz" HEAD
          printf '%s\n' 'Manual UI verification required. No GUI or release was performed by this workflow.' > "$RUNNER_TEMP/preview-results/manual-ui.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-results
          retention-days: 7
