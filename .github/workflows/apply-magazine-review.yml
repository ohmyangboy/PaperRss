name: Apply Magazine Review

on:
  push:
    branches: [feature/issue-32-18-image-views]
    paths: ['.ci/magazine-review/**', '.github/workflows/apply-magazine-review.yml']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: apply-magazine-review
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.repository == 'ohmyangboy/PaperRss' && github.ref == 'refs/heads/feature/issue-32-18-image-views'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed source changes with before and after blob verification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/preview-results"
          python3 - <<'PY'
          import ast, hashlib, pathlib
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          expected_plans = {
              '01.plan': '189b356ce0ee879c8c3e047357e99749e2f09c2d',
              '02.plan': 'c3d8c87e80bb15fdc507de3fe1fc9da74f0f9737',
          }
          allowed = {
              'AppTests/TimelinePresentationTests.swift',
              'PaperRss/Resources/Localization/Localizable.xcstrings',
              'PaperRss/Sources/App/RootView.swift',
              'PaperRss/Sources/App/ThreeColumnSplitView.swift',
              'PaperRss/Sources/App/TimelineImageViews.swift',
              'Tests/MacOS14ZenModeToolbarContractTests.swift',
              'Tests/toolbar-lifetime.test.mjs',
              'docs/drafts/issue-32-article-image-views.md',
          }
          changes = {}
          for name, digest in expected_plans.items():
              data = pathlib.Path('.ci/magazine-review', name).read_bytes()
              assert blob(data) == digest, name
              for name, before, after, edits in ast.literal_eval(data.decode('utf-8')):
                  assert name in allowed and name not in changes, name
                  data = pathlib.Path(name).read_bytes()
                  assert blob(data) == before, (name, 'before')
                  lines = data.decode('utf-8').splitlines(keepends=True)
                  previous_end = 0
                  for start, end, text in edits:
                      assert previous_end <= start <= end <= len(lines)
                      assert isinstance(text, str)
                      previous_end = end
                  for start, end, text in reversed(edits):
                      lines[start:end] = text.splitlines(keepends=True)
                  result = ''.join(lines).encode('utf-8')
                  assert blob(result) == after, (name, 'after')
                  changes[name] = result
          assert set(changes) == allowed
          for name, data in changes.items():
              pathlib.Path(name).write_bytes(data)
              print(name, blob(data))
          PY
          git diff --check
          git add AppTests/TimelinePresentationTests.swift PaperRss/Resources/Localization/Localizable.xcstrings PaperRss/Sources/App/RootView.swift PaperRss/Sources/App/ThreeColumnSplitView.swift PaperRss/Sources/App/TimelineImageViews.swift Tests/MacOS14ZenModeToolbarContractTests.swift Tests/toolbar-lifetime.test.mjs docs/drafts/issue-32-article-image-views.md
          git rm .ci/magazine-review/01.plan .ci/magazine-review/02.plan
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make magazine layout responsive and restore focused article reading'
          git push origin HEAD:refs/heads/feature/issue-32-18-image-views
          git rev-parse HEAD | tee "$RUNNER_TEMP/preview-results/verified-commit.txt"
      - uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-markdown
          ref: '0.8.0'
          path: .ci-deps/swift-markdown
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-cmark
          ref: '0.8.0'
          path: .ci-deps/swift-cmark
          persist-credentials: false
      - name: Verify immutable dependency revisions and resolve
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          test "$(git -C .ci-deps/swift-markdown rev-parse HEAD)" = 3c6f9523da3a1ec2fd829673e472d95b8097a3b8
          test "$(git -C .ci-deps/swift-cmark rev-parse HEAD)" = 924936d0427cb25a61169739a7660230bffa6ea6
          git config --global http.version HTTP/1.1
          git config --global url."file://$GITHUB_WORKSPACE/.ci-deps/swift-markdown/.git".insteadOf https://github.com/swiftlang/swift-markdown.git
          git config --global url."file://$GITHUB_WORKSPACE/.ci-deps/swift-cmark/.git".insteadOf https://github.com/swiftlang/swift-cmark.git
          swift package resolve
      - name: Core and integration regression
        run: |
          set -euo pipefail
          ./scripts/verify.sh --core 2>&1 | tee "$RUNNER_TEMP/preview-results/core.log"
      - name: User-visible feature regression
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./scripts/verify.sh --feature 2>&1 | tee "$RUNNER_TEMP/preview-results/feature.log"
      - name: Reader and shortcut regression
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./scripts/verify.sh --web 2>&1 | tee "$RUNNER_TEMP/preview-results/web.log"
      - name: macOS host build (no signing or release)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          xcodebuild -project PaperRss.xcodeproj -scheme PaperRss -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/PaperRss-build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/preview-results/xcode.log"
      - name: Archive exact source and verification boundary
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/preview-results"
          git archive --format=tar.gz --output="$RUNNER_TEMP/preview-results/source.tar.gz" HEAD
          printf '%s\n' 'Manual UI verification required. CI does not replace native interactive acceptance.' > "$RUNNER_TEMP/preview-results/manual-ui.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magazine-review-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-results
          retention-days: 7
