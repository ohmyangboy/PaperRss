name: Preview Views Verification

on:
  push:
    branches:
      - feature/issue-32-18-image-views
  pull_request:
    paths:
      - 'PaperRss/Sources/**'
      - 'PaperRss/Resources/Localization/**'
      - 'Tests/**'
      - 'AppTests/**'
      - '.github/workflows/preview-views-ci.yml'

permissions:
  contents: read

concurrency:
  group: preview-views-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact reviewed source
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: source.tar.gz
          retention-days: 3
          compression-level: 0
  macos-verification:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-markdown
          ref: '0.8.0'
          path: .ci-deps/swift-markdown
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-cmark
          ref: '0.8.0'
          path: .ci-deps/swift-cmark
          persist-credentials: false
      - name: Verify immutable dependency revisions and use local transport
        run: |
          xcodebuild -version
          swift --version
          test "$(git -C .ci-deps/swift-markdown rev-parse HEAD)" = 3c6f9523da3a1ec2fd829673e472d95b8097a3b8
          test "$(git -C .ci-deps/swift-cmark rev-parse HEAD)" = 924936d0427cb25a61169739a7660230bffa6ea6
          git config --global http.version HTTP/1.1
          git config --global url."file://$GITHUB_WORKSPACE/.ci-deps/swift-markdown/.git".insteadOf https://github.com/swiftlang/swift-markdown.git
          git config --global url."file://$GITHUB_WORKSPACE/.ci-deps/swift-cmark/.git".insteadOf https://github.com/swiftlang/swift-cmark.git
          swift package resolve
      - name: Core and integration regression
        run: ./scripts/verify.sh --core
      - name: User-visible feature regression
        if: ${{ !cancelled() }}
        run: ./scripts/verify.sh --feature
      - name: Reader and shortcut regression
        if: ${{ !cancelled() }}
        run: ./scripts/verify.sh --web
      - name: macOS host build (no signing or release)
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -project PaperRss.xcodeproj -scheme PaperRss -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/PaperRss-build" CODE_SIGNING_ALLOWED=NO build
      - name: Whitespace check
        run: git diff --check
