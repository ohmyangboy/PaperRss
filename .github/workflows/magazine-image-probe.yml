name: Magazine Image Probe
on:
  push:
    branches: [feature/issue-32-18-image-views]
    paths: ['.github/workflows/magazine-image-probe.yml']
permissions:
  contents: read
jobs:
  public-feed-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public feed cover and response (no credentials)
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, re, json
          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'PaperRss/1.0', 'Accept': '*/*'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  body = response.read(9 * 1024 * 1024)
                  return body, {'status': response.status, 'url': response.url, 'mime': response.headers.get('Content-Type'), 'length': response.headers.get('Content-Length'), 'bytes': len(body), 'magic': body[:16].hex()}
          feed, info = fetch('https://weekly.tw93.fun/rss.xml')
          print('FEED', json.dumps(info))
          for item in ET.fromstring(feed).findall('./channel/item'):
              if '/273' not in (item.findtext('link') or ''): continue
              print('ITEM', item.findtext('title'))
              for child in item:
                  if child.attrib: print('ATTRIBUTES', child.tag, child.attrib)
              html = item.findtext('description') or ''
              images = re.findall(r'<img\b[^>]*>', html, re.I)
              print('FIRST_IMAGE', images[0] if images else None)
              urls = re.findall(r'<img\b[^>]*?\bsrc=[\"\x27]([^\"\x27]+)', html, re.I)
              if urls:
                  _, info = fetch(urls[0]); print('COVER', json.dumps(info))
          _, info = fetch('https://cdn.tw93.fun/uPic/27342.JPG')
          print('ORIGINAL_COVER', json.dumps(info))
          PY
