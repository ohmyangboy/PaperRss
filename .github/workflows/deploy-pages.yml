name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/capture-sponsors-preview.py'
      - 'scripts/requirements-sponsors-preview.txt'
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and generate GitHub stars data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          DATA_FILE="website/github-stars.json"
          FETCHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          STARS=""
          if response=$(gh api "repos/$REPO" --jq '.stargazers_count' 2>/dev/null); then
            if [ -n "$response" ] && [ "$response" != "null" ]; then
              STARS="$response"
            fi
          fi

          if [ -n "$STARS" ]; then
            echo "Successfully fetched GitHub stars count: $STARS"
            printf '{\n  "stars": %s,\n  "fetchedAt": "%s"\n}\n' "$STARS" "$FETCHED_AT" > "$DATA_FILE"
          else
            echo "::warning::Failed to fetch stars from GitHub API, retaining existing fallback"
            if [ ! -f "$DATA_FILE" ]; then
              printf '{\n  "stars": 16,\n  "fetchedAt": "%s"\n}\n' "$FETCHED_AT" > "$DATA_FILE"
            fi
          fi

      - name: Setup Python for sponsor preview
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-sponsors-preview.txt

      - name: Install sponsor screenshot Python dependencies
        timeout-minutes: 5
        run: python -m pip install -r scripts/requirements-sponsors-preview.txt

      - name: Install sponsor screenshot browser
        timeout-minutes: 10
        # capture-sponsors-preview.py uses the default headless Chromium shell.
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Install sponsor screenshot fonts
        timeout-minutes: 10
        # The CJK font download needs its own budget on slow Ubuntu mirrors.
        run: |
          sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 \
            install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji

      - name: Capture latest sponsors preview
        timeout-minutes: 3
        run: python scripts/capture-sponsors-preview.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
