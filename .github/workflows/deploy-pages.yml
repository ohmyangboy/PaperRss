name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and generate GitHub stars data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DATA_FILE="website/github-stars.json"
          FETCHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          STARS=""
          if response=$(gh api repos/ohmyangboy/PaperRss --jq '.stargazers_count' 2>/dev/null); then
            if [ -n "$response" ] && [ "$response" != "null" ]; then
              STARS="$response"
            fi
          fi

          if [ -n "$STARS" ]; then
            echo "Successfully fetched GitHub stars count: $STARS"
            printf '{\n  "stars": %s,\n  "fetchedAt": "%s"\n}\n' "$STARS" "$FETCHED_AT" > "$DATA_FILE"
          else
            echo "::warning::Failed to fetch stars from GitHub API, retaining existing fallback"
            if [ ! -f "$DATA_FILE" ]; then
              printf '{\n  "stars": 16,\n  "fetchedAt": "%s"\n}\n' "$FETCHED_AT" > "$DATA_FILE"
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PAPERRSS_WEBSITE_SSH_KEY }}
          SERVER_HOST: ${{ secrets.PAPERRSS_SERVER_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy website to 1leaf
        env:
          SERVER_HOST: ${{ secrets.PAPERRSS_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PAPERRSS_SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "deploy-paperrss-website"