name: Book Turn Repair Verification

on:
  push:
    branches: [feature/issue-32-18-image-views]
    paths: ['.ci/book-turn/**', '.github/workflows/apply-book-turn.yml']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: book-turn-repair
  cancel-in-progress: true

jobs:
  macos-verification:
    if: github.ref == 'refs/heads/feature/issue-32-18-image-views'
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply checksum-reviewed book turn and scrolling repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = feature/issue-32-18-image-views
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, pathlib, os
          root = pathlib.Path('.ci/book-turn')
          files = sorted(root.glob('*.b64'))
          assert len(files) == 3
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in files), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '457cca4079caf7c925dd88ae05498c622c805943980cc9ddbf2b48df308252bc'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'book-turn.patch').write_bytes(patch)
          PYCODE
          # Preserve the newer title-width regression already committed upstream.
          test "$(git hash-object Tests/EntryListTitleToolbarLayoutTests.swift)" = c81211ac4d2373a1f610bd840ee1b756c5847a8e
          git apply --check --exclude=Tests/EntryListTitleToolbarLayoutTests.swift "$RUNNER_TEMP/book-turn.patch"
          git apply --index --exclude=Tests/EntryListTitleToolbarLayoutTests.swift "$RUNNER_TEMP/book-turn.patch"
          git rm .ci/book-turn/*.b64
          git diff --cached --check
          bash -n scripts/verify.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: turn a single book leaf and remove magazine scroll hot paths'
          git push origin HEAD:refs/heads/feature/issue-32-18-image-views
      - name: Record source under test
        run: |
          mkdir -p "$RUNNER_TEMP/preview-results"
          git rev-parse HEAD | tee "$RUNNER_TEMP/preview-results/verified-commit.txt"
      - uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-markdown
          ref: '0.8.0'
          path: .ci-deps/swift-markdown
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-cmark
          ref: '0.8.0'
          path: .ci-deps/swift-cmark
          persist-credentials: false
      - name: Verify immutable dependency revisions and resolve
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          test "$(git -C .ci-deps/swift-markdown rev-parse HEAD)" = 3c6f9523da3a1ec2fd829673e472d95b8097a3b8
          test "$(git -C .ci-deps/swift-cmark rev-parse HEAD)" = 924936d0427cb25a61169739a7660230bffa6ea6
          git config --global http.version HTTP/1.1
          git config --global url."file://$GITHUB_WORKSPACE/.ci-deps/swift-markdown/.git".insteadOf https://github.com/swiftlang/swift-markdown.git
          git config --global url."file://$GITHUB_WORKSPACE/.ci-deps/swift-cmark/.git".insteadOf https://github.com/swiftlang/swift-cmark.git
          swift package resolve
      - name: Core and integration regression
        run: |
          set -euo pipefail
          ./scripts/verify.sh --core 2>&1 | tee "$RUNNER_TEMP/preview-results/core.log"
      - name: User-visible feature regression
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./scripts/verify.sh --feature 2>&1 | tee "$RUNNER_TEMP/preview-results/feature.log"
      - name: Reader and shortcut regression
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./scripts/verify.sh --web 2>&1 | tee "$RUNNER_TEMP/preview-results/web.log"
      - name: macOS host build (no signing or release)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          xcodebuild -project PaperRss.xcodeproj -scheme PaperRss -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/PaperRss-build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/preview-results/xcode.log"
      - name: Whitespace check
        if: ${{ !cancelled() }}
        run: git diff --check
      - name: Archive exact source and verification boundary
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/preview-results"
          git archive --format=tar.gz --output="$RUNNER_TEMP/preview-results/source.tar.gz" HEAD
          printf '%s\n' 'Manual UI verification required. CI does not replace native interactive acceptance.' > "$RUNNER_TEMP/preview-results/manual-ui.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-verification-${{ github.sha }}
          path: ${{ runner.temp }}/preview-results
          retention-days: 7
